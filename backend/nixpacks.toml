[phases.setup]
aptPkgs = [
  'libnss3', 'libatk1.0-0', 'libatk-bridge2.0-0', 'libcups2',
  'libgbm1', 'libasound2t64', 'libpangocairo-1.0-0',
  'libxss1', 'libgtk-3-0', 'libxshmfence1', 'libglu1',
  'fonts-liberation', 'fonts-thai-tlwg', 'fonts-noto', 'fonts-noto-cjk', 'wget'
]
cmds = [
  'wget -q https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb -O /tmp/chrome.deb && apt-get install -y /tmp/chrome.deb && rm -f /tmp/chrome.deb'
]

[start]
cmd = 'node src/app.js'
